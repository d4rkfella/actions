name: Build single package with Melange
description: Build and test a Melange package, then upload it to an APK registry.

inputs:
  config:
    description: Config file to use for building the package.
    default: ./melange.yaml
    required: false

  config-file-license:
    description: License to use for the Melange config itself.
    default: Apache-2.0

  arch:
    description: Architecture to build for.
    default: x86_64
    required: false

  sign-package:
    default: false
    required: false

  signing-key:
    description: Private key for signing packages (pass a GitHub secret here).
    required: false
    default: ''

  output-dir:
    description: Directory where the package will be written.
    default: ${{ github.workspace }}/packages
    required: false

  tests-repository-append:
    description: Repositories to include in the test environment.
    default: ''
    required: false

  repository-append:
    description: Repositories to include in the build environment.
    default: ''
    required: false

  tests-keyring-append:
    description: Keys to include in the test environment.
    default: ''
    required: false

  keyring-append:
    description: Keys to include in the build environment.
    default: ''
    required: false

  workspace-dir:
    description: Directory to use as the workspace.
    default: ''
    required: false

  maintainer:
    description: Namespace for SBOM package URLs.
    default: ''
    required: false

  empty-workspace:
    description: Whether to use an empty workspace.
    default: false
    required: false

  source-dir:
    description: Source directory to use when empty-workspace is false.
    default: ${{ github.workspace }}
    required: false

  cache-dir:
    description: Directory used for cached inputs.
    default: ''
    required: false

  pipeline-dir:
    description: Directory used for pipelines.
    default: ${{ github.workspace }}/pipelines
    required: false

  git-commit:
    description: Commit hash of the repository containing the build config.
    default: ''
    required: false

  git-repo-url:
    description: URL of the repository containing the build config.
    default: ''
    required: false

  registry-url:
    description: Base URL of the APK registry, for example https://packages.example.com.
    required: true

  registry-repository:
    description: Repository prefix configured in the registry.
    default: os
    required: false

  registry-token:
    description: API key with deploy permission.
    required: true

runs:
  using: composite
  steps:
    - name: Configure AppArmor profile for bubblewrap
      shell: bash
      run: |
        set -euo pipefail

        sudo tee /etc/apparmor.d/local-bwrap >/dev/null <<'EOF'
        abi <abi/4.0>,
        include <tunables/global>

        profile local-bwrap /usr/local/bin/bwrap flags=(unconfined) {
          userns,
          # Site-specific additions and overrides. See local/README for details.
          include if exists <local/bwrap>
        }
        EOF

        sudo systemctl reload apparmor

    - name: Validate bubblewrap user namespace support
      shell: bash
      run: |
        set -euo pipefail

        if ! bwrap --unshare-user --bind / / true; then
          echo "::error::failed to verify 'bwrap --unshare-user'"
          command -v bwrap || :
          ls /proc/self/ns || echo "no /proc/self/ns"
          kver="$(uname -r)" || echo "uname -r failed"
          if [ -f "/boot/config-${kver}" ]; then
            grep CONFIG_USER_NS "/boot/config-${kver}" \
              || echo "no CONFIG_USER_NS in /boot/config-${kver}"
          fi

          exit 1
        fi
        echo "bubblewrap (bwrap) user namespace support validated successfully."

    - name: Set signing key from secret
      id: signing_key
      if: ${{ inputs.sign-package == 'true' }}
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        if [[ -z "$SIGNING_KEY" ]]; then
          echo "Error: sign-package is enabled but signing-key input is not set."
          exit 1
        fi

        KEY_PATH="${RUNNER_TEMP}/.melange/melange-signing.rsa"
        mkdir -p "$(dirname "$KEY_PATH")"
        chmod 700 "$(dirname "$KEY_PATH")"
        printf '%s' "$SIGNING_KEY" > "$KEY_PATH"
        chmod 400 "$KEY_PATH"
        echo "signing-key-path=$KEY_PATH" >> "$GITHUB_OUTPUT"

    - name: Check for existing repositories in Melange config
      id: check_config_repos
      shell: bash
      run: |
        if [[ $(yq eval '(.environment.contents.repositories | length // 0) > 0' "${{ inputs.config }}" 2>/dev/null) == "true" ]]; then
          echo "has_config_repos=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_config_repos=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      shell: bash
      run: |
        args=()
        args+=(build "${{ inputs.config }}" --generate-provenance=false --package-append busybox --license "${{ inputs.config-file-license }}" --arch "${{ inputs.arch }}" --out-dir "${{ inputs.output-dir }}")

        if [[ "${{ steps.check_config_repos.outputs.has_config_repos }}" == "false" ]]; then
          [ -n "${{ inputs.repository-append }}" ] && args+=(--repository-append "${{ inputs.repository-append }}")
          [ -n "${{ inputs.keyring-append }}" ] && args+=(--keyring-append "${{ inputs.keyring-append }}")
        fi

        [ -n "${{ inputs.workspace-dir }}" ] && args+=(--workspace-dir "${{ inputs.workspace-dir }}")
        [ -n "${{ inputs.maintainer }}" ] && args+=(--namespace "${{ inputs.maintainer }}")
        [ -n "${{ inputs.cache-dir }}" ] && args+=(--cache-dir "${{ inputs.cache-dir }}")
        [ -n "${{ inputs.pipeline-dir }}" ] && args+=(--pipeline-dir "${{ inputs.pipeline-dir }}")
        [ -n "${{ inputs.git-commit }}" ] && args+=(--git-commit "${{ inputs.git-commit }}")
        [ -n "${{ inputs.git-repo-url }}" ] && args+=(--git-repo-url "${{ inputs.git-repo-url }}")

        if [[ "${{ inputs.empty-workspace }}" == "true" ]]; then
          args+=(--empty-workspace)
        else
          args+=(--source-dir "${{ inputs.source-dir }}/$(dirname "${{ inputs.config }}")")
        fi

        if [[ "${{ inputs.sign-package }}" == "true" ]]; then
          args+=(--signing-key "${{ steps.signing_key.outputs.signing-key-path }}")
        fi

        melange "${args[@]}"

    - name: Check for reproducible build flag
      id: is_reproducible
      shell: bash
      run: |
        REPRODUCIBLE=$(yq eval '.environment.environment.REPRODUCIBLE' "${{ inputs.config }}")

        if [ -z "$REPRODUCIBLE" ] || [ "$REPRODUCIBLE" = "null" ]; then
          REPRODUCIBLE="true"
        fi

        echo "REPRODUCIBLE=$REPRODUCIBLE" >> "$GITHUB_ENV"
        echo "reproducible=$REPRODUCIBLE" >> "$GITHUB_OUTPUT"

    - name: Rebuild package
      if: steps.is_reproducible.outputs.reproducible == 'true'
      shell: bash
      run: |
        args=()
        args+=(rebuild "${{ inputs.output-dir }}"/"${{ inputs.arch }}"/*.apk)

        if [[ "${{ inputs.sign-package }}" == "true" ]]; then
          args+=(--signing-key "${{ steps.signing_key.outputs.signing-key-path }}")
        fi

        if [[ "${{ inputs.empty-workspace }}" == "true" ]]; then
          args+=(--empty-workspace)
        else
          args+=(--source-dir "${{ inputs.source-dir }}/$(dirname "${{ inputs.config }}")")
        fi

        melange "${args[@]}"

    - name: Test package
      shell: bash
      run: |
        args=()
        args+=(test "${{ inputs.config }}" --arch "${{ inputs.arch }}" --test-package-append wolfi-base)
        args+=(--repository-append "${{ inputs.output-dir }}")

        if [[ "${{ inputs.sign-package }}" == "true" ]]; then
          openssl pkey -in "${{ steps.signing_key.outputs.signing-key-path }}" -pubout \
            -out "${{ steps.signing_key.outputs.signing-key-path }}.pub"
          args+=(--keyring-append "${{ steps.signing_key.outputs.signing-key-path }}.pub")
        fi

        [ -n "${{ inputs.tests-repository-append }}" ] && args+=(--repository-append "${{ inputs.tests-repository-append }}")
        [ -n "${{ inputs.tests-keyring-append }}" ] && args+=(--keyring-append "${{ inputs.tests-keyring-append }}")
        [ -n "${{ inputs.workspace-dir }}" ] && args+=(--workspace-dir "${{ inputs.workspace-dir }}")
        [ -n "${{ inputs.pipeline-dir }}" ] && args+=(--pipeline-dirs "${{ inputs.pipeline-dir }}")

        if [[ "${{ inputs.empty-workspace }}" == "true" ]]; then
          args+=(--empty-workspace)
        else
          args+=(--source-dir "${{ inputs.source-dir }}/$(dirname "${{ inputs.config }}")")
        fi

        melange "${args[@]}" --runner docker

    - name: Upload packages to APK registry
      shell: bash
      env:
        APK_REGISTRY_URL: ${{ inputs.registry-url }}
        APK_REGISTRY_REPOSITORY: ${{ inputs.registry-repository }}
        APK_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        APK_REGISTRY_ARCH: ${{ inputs.arch }}
        APK_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail

        registry_url="${APK_REGISTRY_URL%/}"
        repository="${APK_REGISTRY_REPOSITORY#/}"
        repository="${repository%/}"
        apk_dir="${APK_OUTPUT_DIR}/${APK_REGISTRY_ARCH}"

        if [[ -z "$registry_url" || -z "$repository" || -z "$APK_REGISTRY_TOKEN" ]]; then
          echo "::error::registry-url, registry-repository, and registry-token must be set"
          exit 1
        fi

        shopt -s nullglob
        packages=("$apk_dir"/*.apk)
        if (( ${#packages[@]} == 0 )); then
          echo "::error::No APK packages found in $apk_dir"
          exit 1
        fi

        for apk in "${packages[@]}"; do
          filename="${apk##*/}"
          package_url="${registry_url}/${repository}/${APK_REGISTRY_ARCH}/${filename}"
          echo "Uploading ${filename} to ${package_url}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${APK_REGISTRY_TOKEN}" \
            --upload-file "$apk" \
            "$package_url"
        done
